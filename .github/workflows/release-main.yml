name: Release CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run typecheck
      - name: Portable regression gate
        run: node --test tests/cli.test.js tests/config.test.js tests/core-client.test.js tests/distribution.test.js
      - name: Assemble portable CLI archive
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf release-assets/service-lasso-cli-node22.tar.gz dist package.json README.md
          (cd release-assets && sha256sum service-lasso-cli-node22.tar.gz > SHA256SUMS.txt)
      - name: Compute release version
        id: version
        run: echo "version=$(date -u +%Y.%-m.%-d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/service-lasso-cli-node22.tar.gz
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
