name: Isolated ordinary CLI real-Core E2E
on:
  pull_request:
    branches: [develop]
    paths: ['src/**', 'scripts/e2e-local.mjs', 'tests/e2e-local.test.js', 'package*.json', '.github/workflows/e2e-local.yml']
  workflow_dispatch:
    inputs:
      core_revision:
        description: Exact qualified Core develop commit containing operator-e2e-fixture
        required: true
        type: string
env:
  PINNED_CORE_REVISION: 85a94a131f488faee55dc36efcfb04827a267442
permissions:
  contents: read
jobs:
  ordinary-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - name: Validate explicit Core source revision
        env:
          CORE_REVISION: ${{ inputs.core_revision || '85a94a131f488faee55dc36efcfb04827a267442' }}
        run: '[[ "$CORE_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: ${{ inputs.core_revision || '85a94a131f488faee55dc36efcfb04827a267442' }}
          path: core
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare exact fresh Core locked dependencies
        working-directory: core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded helper and failure-path tests
        run: node --test tests/e2e-local.test.js
      - name: Build current CLI and fresh exact Core, then run owned smoke
        env:
          CORE_REVISION: ${{ inputs.core_revision || '85a94a131f488faee55dc36efcfb04827a267442' }}
          EVIDENCE_PATH: ${{ runner.temp }}/cli-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run e2e:local -- --core-dir "$GITHUB_WORKSPACE/core" --core-revision "$CORE_REVISION" --output-dir "$EVIDENCE_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ordinary-cli-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/cli-e2e-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error
