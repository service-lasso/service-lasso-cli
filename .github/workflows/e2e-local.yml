name: Isolated ordinary CLI real-Core E2E
on:
  pull_request:
    branches: [develop]
    paths: ['src/**', 'scripts/e2e-*.mjs', 'tests/e2e-*.test.js', 'package*.json', '.github/workflows/e2e-local.yml']
  workflow_dispatch:
    inputs:
      core_revision:
        description: Exact qualified Core develop commit containing operator-e2e-fixture
        required: true
        type: string
env:
  PINNED_CORE_REVISION: f32270731ff42f2a2f6dbcbc02f188b3fdd8813b
permissions:
  contents: read
jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
          path: core
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generic helpers and actual shared platform setup contracts
        env:
          SERVICE_LASSO_TEST_CORE_DIR: ${{ github.workspace }}/core
          SERVICE_LASSO_TEST_CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
        run: node --test tests/e2e-local.test.js tests/e2e-portable.test.js scripts/e2e-platform.test.mjs
  ordinary-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - name: Validate explicit Core source revision
        shell: bash
        env:
          CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
        run: '[[ "$CORE_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
          path: core
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare exact fresh Core locked dependencies
        working-directory: core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded helper and failure-path tests
        env:
          SERVICE_LASSO_TEST_CORE_DIR: ${{ github.workspace }}/core
          SERVICE_LASSO_TEST_CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
        run: node --test tests/e2e-local.test.js scripts/e2e-platform.test.mjs
      - name: Build current CLI and fresh exact Core, then run owned smoke
        shell: bash
        env:
          CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
          EVIDENCE_PATH: ${{ runner.temp }}/cli-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run e2e:local -- --core-dir "$GITHUB_WORKSPACE/core" --core-revision "$CORE_REVISION" --output-dir "$EVIDENCE_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ordinary-cli-e2e-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cli-e2e-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error

  portable-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - name: Validate explicit Core source revision
        shell: bash
        env:
          CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
        run: '[[ "$CORE_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
          path: core
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare exact fresh Core locked dependencies
        working-directory: core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded helper and failure-path tests
        env:
          SERVICE_LASSO_TEST_CORE_DIR: ${{ github.workspace }}/core
          SERVICE_LASSO_TEST_CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
        run: node --test tests/e2e-local.test.js tests/e2e-portable.test.js scripts/e2e-platform.test.mjs
      - name: Build current CLI and fresh exact Core, then run owned smoke
        shell: bash
        env:
          CORE_REVISION: ${{ inputs.core_revision || env.PINNED_CORE_REVISION }}
          EVIDENCE_PATH: ${{ runner.temp }}/cli-portable-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run e2e:portable -- --core-dir "$GITHUB_WORKSPACE/core" --core-revision "$CORE_REVISION" --output-dir "$EVIDENCE_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-node-cli-e2e-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cli-portable-e2e-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error
