name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Node 22 CLI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  real-core-read-acceptance:
    name: Direct real-Core reads (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          repository: service-lasso/service-lasso
          ref: 454d1590698a36194847755a4aabc4a59d6c5ec4
          path: core
      - name: Build pinned Core runtime
        working-directory: core
        run: |
          npm ci
          npm run build
      - name: Run direct compiled CLI read acceptance
        env:
          SERVICE_LASSO_CORE_DIR: ${{ github.workspace }}/core
        run: |
          npm run build
          node --test tests/real-core-read-acceptance.test.js tests/real-core-durable-acceptance.test.js
