name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  native-sea:
    name: Native SEA direct execution (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            expected_platform: win32
            expected_architecture: x64
          - name: Linux x64
            os: ubuntu-latest
            expected_platform: linux
            expected_architecture: x64
          - name: macOS arm64
            os: macos-14
            expected_platform: darwin
            expected_architecture: arm64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: revision
        name: Record exact source revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="${PR_HEAD_SHA:-$EVENT_SHA}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tested_base_sha=${PR_BASE_SHA:-}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build host-native executable and provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.revision.outputs.source_sha }}"
          npm run package:native -- --output native-assets --source-sha "$source_sha" --version "0.1.0-dev.${source_sha::7}"
      - name: Record CI event context separately from native provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.revision.outputs.source_sha }}
          TESTED_BASE_SHA: ${{ steps.revision.outputs.tested_base_sha }}
          MERGE_CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); fs.writeFileSync("native-assets/ci-context.json", `${JSON.stringify({schemaVersion:1,eventName:process.env.EVENT_NAME,sourceSha:process.env.SOURCE_SHA,testedBaseSha:process.env.TESTED_BASE_SHA||null,mergeContextSha:process.env.MERGE_CONTEXT_SHA},null,2)}\n`);'
      - name: Execute native binary with Node absent from PATH
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:native -- --directory native-assets --expected-source-sha "${{ steps.revision.outputs.source_sha }}"
      - name: Verify exact-head provenance and CI event context
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-native-ci-provenance.mjs --directory native-assets --expected-source-sha "${{ steps.revision.outputs.source_sha }}" --expected-event "${{ github.event_name }}" --expected-base-sha "${{ steps.revision.outputs.tested_base_sha }}" --expected-platform "${{ matrix.expected_platform }}" --expected-architecture "${{ matrix.expected_architecture }}"
      - name: Verify declared host target
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./native-assets/provenance.json"); if(p.executable.platform!==process.env.EXPECTED_PLATFORM || p.executable.architecture!==process.env.EXPECTED_ARCHITECTURE) process.exit(1)'
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.expected_architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-lassoctl-sea-${{ matrix.expected_platform }}-${{ matrix.expected_architecture }}-${{ steps.revision.outputs.source_sha }}
          path: native-assets/
          if-no-files-found: error
          retention-days: 90

  test:
    name: Node 22 CLI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  completion-shells:
    name: Completion shell checks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: npm ci
      - run: npm run build
      - run: node --test tests/completion.test.js

  real-core-read-acceptance:
    name: Direct real-Core reads (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: d6dc5558307f13c654194ddc944e3be40c940675
          path: core
      - name: Build pinned Core runtime
        working-directory: core
        run: |
          npm ci
          npm run build
      - name: Run direct source-built CLI acceptance
        env:
          SERVICE_LASSO_CORE_DIR: ${{ github.workspace }}/core
        run: |
          npm run build
          node --test tests/real-core-read-acceptance.test.js tests/real-core-durable-acceptance.test.js
      - name: Run direct native CLI durable acceptance with Node absent from the child PATH
        env:
          SERVICE_LASSO_CORE_DIR: ${{ github.workspace }}/core
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          npm run package:native -- --output native-assets --source-sha "$source_sha" --version "0.1.0-dev.${source_sha::7}"
          SERVICE_LASSO_CLI_NATIVE_EXE="$GITHUB_WORKSPACE/native-assets/service-lassoctl" node --test tests/real-core-durable-acceptance.test.js
