name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  native-sea:
    name: Native SEA direct execution (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            expected_platform: win32
            expected_architecture: x64
          - name: Linux x64
            os: ubuntu-latest
            expected_platform: linux
            expected_architecture: x64
          - name: macOS arm64
            os: macos-14
            expected_platform: darwin
            expected_architecture: arm64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: revision
        name: Record exact source revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="${PR_HEAD_SHA:-$EVENT_SHA}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tested_base_sha=${PR_BASE_SHA:-}" >> "$GITHUB_OUTPUT"
          echo "candidate_version=0.1.0-dev.${source_sha::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22.x"
      - name: Establish isolated native qualification custody before dependencies
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/service-lasso-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${RUNNER_OS}"
          echo "SERVICE_LASSO_WORKSPACE_ROOT=$qualification_root/workspace" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_INSTANCE_REGISTRY_PATH=$qualification_root/instance/registry.json" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_HOST_PORT_REGISTRY_PATH=$qualification_root/host-port/registry.json" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS=$GITHUB_WORKSPACE/native-qualification-receipts" >> "$GITHUB_ENV"
          SERVICE_LASSO_WORKSPACE_ROOT="$qualification_root/workspace" SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$qualification_root/instance/registry.json" SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$qualification_root/host-port/registry.json" node scripts/prepare-native-qualification-receipt.mjs --receipt-directory "$GITHUB_WORKSPACE/native-qualification-receipts"
      - run: npm ci
      - run: npm run typecheck
      - name: Build host-native executable and provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.revision.outputs.source_sha }}"
          npm run package:native -- --output native-assets --source-sha "$source_sha" --version "${{ steps.revision.outputs.candidate_version }}"
      - name: Record schema-closed CI event context separately from native provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.revision.outputs.source_sha }}
          TESTED_BASE_SHA: ${{ steps.revision.outputs.tested_base_sha }}
          MERGE_CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/write-native-ci-context.mjs --directory native-assets --event-name "$EVENT_NAME" --source-sha "$SOURCE_SHA" --tested-base-sha "$TESTED_BASE_SHA" --merge-context-sha "$MERGE_CONTEXT_SHA"
      - name: Retain blocked Darwin external qualification prerequisite
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/record-darwin-qualification-block.mjs --receipt-directory "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS" --directory native-assets
      - name: Execute native binary with Node absent from PATH
        shell: bash
        run: |
          set -euo pipefail
          executable="native-assets/service-lassoctl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable+=".exe"; fi
          node scripts/run-native-qualification-phase.mjs --receipt-directory "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS" --phase smoke --executable "$executable" -- node scripts/smoke-native.mjs --directory native-assets --expected-source-sha "${{ steps.revision.outputs.source_sha }}" --expected-version "${{ steps.revision.outputs.candidate_version }}" --write-host-acceptance
      - name: Record expected unavailable controlled primary-route result
        shell: bash
        run: |
          set -euo pipefail
          executable="native-assets/service-lassoctl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable+=".exe"; fi
          SERVICE_LASSO_NATIVE_ROUTE_RESULT="$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS/inner-route.json" SERVICE_LASSO_CONTROLLED_NATIVE_EXE="$GITHUB_WORKSPACE/$executable" node scripts/run-native-qualification-phase.mjs --receipt-directory "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS" --phase route --qualification-status unavailable --expected-exit zero --route-result "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS/inner-route.json" --executable "$executable" -- node --test --test-name-pattern "controlled source admission" tests/native-distribution.test.js
      - name: Verify Darwin process-exit admission rejection
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          (cd native/primary-gate && go test ./...)
      - name: Verify exact-head provenance and CI event context
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-native-ci-provenance.mjs --directory native-assets --expected-source-sha "${{ steps.revision.outputs.source_sha }}" --expected-event "${{ github.event_name }}" --expected-base-sha "${{ steps.revision.outputs.tested_base_sha }}" --expected-merge-context-sha "${{ github.sha }}" --expected-platform "${{ matrix.expected_platform }}" --expected-architecture "${{ matrix.expected_architecture }}"
      - name: Verify declared host target
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./native-assets/provenance.json"); if(p.executable.platform!==process.env.EXPECTED_PLATFORM || p.executable.architecture!==process.env.EXPECTED_ARCHITECTURE) process.exit(1)'
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.expected_architecture }}
      - name: Archive accepted native bytes for the qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          executable="native-assets/service-lassoctl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable+=".exe"; fi
          mkdir -p native-qualification-archive
          archive="native-qualification-archive/service-lassoctl-${{ steps.revision.outputs.candidate_version }}-${{ matrix.expected_platform }}-${{ matrix.expected_architecture }}.tar.gz"
          node scripts/run-native-qualification-phase.mjs --receipt-directory "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS" --phase archive --executable "$executable" --artifact "$archive" -- node scripts/archive-native-candidate.mjs --directory native-assets --output native-qualification-archive --expected-event "${{ github.event_name }}" --expected-base-sha "${{ steps.revision.outputs.tested_base_sha }}" --expected-merge-context-sha "${{ github.sha }}" --version "${{ steps.revision.outputs.candidate_version }}" --source-sha "${{ steps.revision.outputs.source_sha }}"
      - name: Retain the explicitly open native qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          executable="native-assets/service-lassoctl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable+=".exe"; fi
          node scripts/verify-native-qualification-open.mjs --receipt-directory "$SERVICE_LASSO_NATIVE_QUALIFICATION_RECEIPTS" --executable "$executable"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-lassoctl-sea-${{ matrix.expected_platform }}-${{ matrix.expected_architecture }}-${{ steps.revision.outputs.source_sha }}
          path: |
            native-assets/
            native-qualification-archive/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-qualification-receipts-${{ matrix.expected_platform }}-${{ matrix.expected_architecture }}-${{ github.sha }}
          path: native-qualification-receipts/
          if-no-files-found: error
          retention-days: 90

  test:
    name: Node 22 CLI checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22.x"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  completion-shells:
    name: Completion shell checks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: npm ci
      - run: npm run build
      - run: node --test tests/completion.test.js

  real-core-read-acceptance:
    name: Direct real-Core reads (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22.x"
      - run: npm ci
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: service-lasso/service-lasso
          ref: 9bef20259e5b43f6bcd2e9796da0f35396305425
          path: core
      - name: Build pinned Core runtime
        working-directory: core
        run: |
          npm ci
          npm run build
      - name: Run direct source-built CLI acceptance
        env:
          SERVICE_LASSO_CORE_DIR: ${{ github.workspace }}/core
          SERVICE_LASSO_CORE_EXPECTED_REVISION: 9bef20259e5b43f6bcd2e9796da0f35396305425
        run: |
          npm run build
          node --test tests/real-core-read-acceptance.test.js tests/real-core-durable-acceptance.test.js
      - name: Run direct native CLI durable acceptance with Node absent from the child PATH
        env:
          SERVICE_LASSO_CORE_DIR: ${{ github.workspace }}/core
          SERVICE_LASSO_CORE_EXPECTED_REVISION: 9bef20259e5b43f6bcd2e9796da0f35396305425
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          npm run package:native -- --output native-assets --source-sha "$source_sha" --version "0.1.0-dev.${source_sha::7}"
          SERVICE_LASSO_CLI_NATIVE_EXE="$GITHUB_WORKSPACE/native-assets/service-lassoctl" node --test tests/real-core-durable-acceptance.test.js
